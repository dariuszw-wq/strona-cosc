<svg viewBox="0 0 640 470" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans',sans-serif">
<defs>
<linearGradient id="kbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7f9fd"/><stop offset="1" stop-color="#e7ecf7"/></linearGradient>
<linearGradient id="ksheet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f2f5fc"/></linearGradient>
<linearGradient id="kfree" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6d6ae0"/><stop offset="1" stop-color="#4636c9"/></linearGradient>
<linearGradient id="kcoin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f6fb"/><stop offset="1" stop-color="#cbd5ea"/></linearGradient>
<linearGradient id="kshield" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d2f63"/><stop offset="1" stop-color="#16244c"/></linearGradient>
<filter id="ksoft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#0b1226" flood-opacity="0.32"/></filter>
<filter id="ksoft2" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0b1226" flood-opacity="0.28"/></filter>
</defs>

<rect width="640" height="470" rx="18" fill="url(#kbg)"/>

<!-- delikatna siatka tla -->
<g stroke="#d3dcee" stroke-width="1" opacity="0.55">
  <line x1="0" y1="118" x2="640" y2="118"/>
  <line x1="0" y1="236" x2="640" y2="236"/>
  <line x1="0" y1="354" x2="640" y2="354"/>
</g>

<!-- arkusz wyplaty -->
<g filter="url(#ksoft)" transform="rotate(-2.5 320 240)">
  <rect x="96" y="96" width="368" height="288" rx="16" fill="url(#ksheet)"/>
  <rect x="96" y="96" width="368" height="288" rx="16" fill="none" stroke="#dde4f2" stroke-width="1"/>

  <!-- naglowek arkusza: paski imitujace wiersze, bez tekstu -->
  <rect x="124" y="128" width="150" height="12" rx="6" fill="#c7d0e6"/>
  <rect x="124" y="150" width="96"  height="9"  rx="4.5" fill="#dde3f1"/>

  <!-- pasek: calosc wynagrodzenia podzielona na czesc chroniona i zajeta -->
  <rect x="124" y="196" width="312" height="44" rx="10" fill="#e8ecf7"/>
  <rect x="124" y="196" width="226" height="44" rx="10" fill="url(#kfree)"/>
  <path d="M350 196 h76 a10 10 0 0 1 10 10 v24 a10 10 0 0 1 -10 10 h-76 z" fill="#d4213d"/>
  <line x1="350" y1="188" x2="350" y2="248" stroke="#16244c" stroke-width="2" stroke-dasharray="5 4" opacity="0.65"/>

  <!-- wiersze ponizej: pozycje rozliczenia -->
  <g fill="#e2e8f4">
    <rect x="124" y="270" width="312" height="9" rx="4.5"/>
    <rect x="124" y="292" width="268" height="9" rx="4.5"/>
    <rect x="124" y="314" width="196" height="9" rx="4.5"/>
  </g>
  <rect x="124" y="340" width="120" height="11" rx="5.5" fill="#c7d0e6"/>
</g>

<!-- tarcza nad czescia chroniona -->
<g filter="url(#ksoft2)" transform="translate(150 236)">
  <path d="M46 0 L92 18 V54 C92 84 70 106 46 116 C22 106 0 84 0 54 V18 Z" fill="url(#kshield)"/>
  <path d="M46 0 L92 18 V54 C92 84 70 106 46 116 C22 106 0 84 0 54 V18 Z" fill="none" stroke="#4636c9" stroke-width="2" opacity="0.8"/>
  <path d="M28 56 L41 70 L66 44" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- stos monet po prawej: czesc odchodzaca -->
<g filter="url(#ksoft2)" transform="translate(470 250)">
  <ellipse cx="54" cy="104" rx="54" ry="17" fill="#cbd5ea" opacity="0.6"/>
  <g>
    <rect x="8" y="78" width="92" height="22" rx="11" fill="url(#kcoin)" stroke="#b7c3dc" stroke-width="1"/>
    <rect x="8" y="54" width="92" height="22" rx="11" fill="url(#kcoin)" stroke="#b7c3dc" stroke-width="1"/>
    <rect x="8" y="30" width="92" height="22" rx="11" fill="url(#kcoin)" stroke="#b7c3dc" stroke-width="1"/>
  </g>
  <!-- moneta odrywajaca sie - akcent czerwony -->
  <g transform="rotate(-16 54 4)">
    <rect x="8" y="-8" width="92" height="22" rx="11" fill="#d4213d"/>
    <rect x="8" y="-8" width="92" height="22" rx="11" fill="none" stroke="#a81730" stroke-width="1"/>
  </g>
</g>

<!-- strzalka: czesc zajeta wedruje poza wyplate -->
<path d="M452 206 C492 206 506 206 526 218" fill="none" stroke="#16244c" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
<path d="M520 208 L532 219 L518 227" fill="none" stroke="#16244c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
</svg>
