<linearGradient id="wfar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a3a68"/><stop offset="1" stop-color="#36487a"/></linearGradient>
<linearGradient id="wleft" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#16244c"/><stop offset="1" stop-color="#243461"/></linearGradient>
