<filter id="wsoft" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#0b1226" flood-opacity="0.45"/></filter>
<clipPath id="wclip"><rect width="640" height="470" rx="18"/></clipPath>
