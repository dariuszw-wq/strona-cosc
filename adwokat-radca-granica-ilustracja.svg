<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans',sans-serif">
<defs>
<linearGradient id="abg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7f9fd"/><stop offset="1" stop-color="#e7ecf7"/></linearGradient>
<linearGradient id="abud" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbfcfe"/><stop offset="1" stop-color="#ccd6ea"/></linearGradient>
<linearGradient id="asad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4636c9"/><stop offset="1" stop-color="#2f2699"/></linearGradient>
<filter id="asoft" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#0b1226" flood-opacity="0.3"/></filter>
</defs>

<rect width="640" height="400" rx="18" fill="url(#abg)"/>

<!-- os / droga sprawy -->
<line x1="52" y1="300" x2="588" y2="300" stroke="#c6d0e6" stroke-width="4" stroke-linecap="round"/>

<!-- ETAP 1: urzad -->
<g filter="url(#asoft)" transform="translate(64 150)">
  <rect x="0" y="86" width="190" height="10" rx="3" fill="#c3cde3"/>
  <rect x="12" y="74" width="166" height="12" rx="3" fill="#d3dbee"/>
  <rect x="24" y="16" width="142" height="58" fill="url(#abud)"/>
  <path d="M16 16 L95 -14 L174 16 Z" fill="#dde4f3"/>
  <g fill="#aab7d6">
    <rect x="40" y="30" width="14" height="36" rx="3"/>
    <rect x="68" y="30" width="14" height="36" rx="3"/>
    <rect x="96" y="30" width="14" height="36" rx="3"/>
    <rect x="124" y="30" width="14" height="36" rx="3"/>
  </g>
</g>
<circle cx="159" cy="300" r="11" fill="#ffffff" stroke="#8fa0cc" stroke-width="3"/>

<!-- ETAP 2: sad -->
<g filter="url(#asoft)" transform="translate(394 136)">
  <rect x="0" y="100" width="190" height="12" rx="3" fill="#2a3a68"/>
  <rect x="12" y="86" width="166" height="14" rx="3" fill="#35477f"/>
  <rect x="24" y="22" width="142" height="64" fill="url(#asad)"/>
  <path d="M14 22 L95 -12 L176 22 Z" fill="#5a4ed6"/>
  <g fill="#b9c2ea" opacity="0.85">
    <rect x="42" y="38" width="14" height="40" rx="3"/>
    <rect x="70" y="38" width="14" height="40" rx="3"/>
    <rect x="98" y="38" width="14" height="40" rx="3"/>
    <rect x="126" y="38" width="14" height="40" rx="3"/>
  </g>
</g>
<circle cx="489" cy="300" r="11" fill="#ffffff" stroke="#4636c9" stroke-width="3"/>

<!-- granica: slupek z czerwonym akcentem -->
<g transform="translate(324 0)">
  <line x1="0" y1="128" x2="0" y2="300" stroke="#16244c" stroke-width="3" stroke-dasharray="7 6" opacity="0.6"/>
  <circle cy="300" r="14" fill="#d4213d"/>
  <circle cy="300" r="14" fill="none" stroke="#ffffff" stroke-width="3"/>
  <g transform="translate(0 150)">
    <path d="M-34 0 h68 a9 9 0 0 1 9 9 v30 a9 9 0 0 1 -9 9 h-68 a9 9 0 0 1 -9 -9 v-30 a9 9 0 0 1 9 -9 z" fill="#16244c"/>
    <g stroke="#ffffff" stroke-width="3.5" stroke-linecap="round">
      <line x1="-16" y1="24" x2="16" y2="24"/>
      <line x1="0" y1="12" x2="0" y2="36"/>
      <line x1="-16" y1="18" x2="-16" y2="30"/>
      <line x1="16" y1="18" x2="16" y2="30"/>
    </g>
  </g>
</g>

<!-- strzalka kierunku -->
<path d="M548 300 L566 300" stroke="#4636c9" stroke-width="4" stroke-linecap="round"/>
<path d="M560 293 L570 300 L560 307" fill="none" stroke="#4636c9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

<!-- sygnatury etapow: kropki bez tekstu -->
<g fill="#aab7d6">
  <circle cx="110" cy="340" r="4"/><circle cx="128" cy="340" r="4"/><circle cx="146" cy="340" r="4"/>
</g>
<g fill="#6d6ae0">
  <circle cx="462" cy="340" r="4"/><circle cx="480" cy="340" r="4"/><circle cx="498" cy="340" r="4"/>
</g>
</svg>
